name: Collect NBA ticket prices

on:
  schedule:
    # Every hour at :07 (off the top of the hour, when GitHub's scheduler is busiest).
    # The script decides which games are due: 6h / 3h / 1h depending on time to tip-off.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot every upcoming game this run"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect prices
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python collector/collect.py --force
          else
            python collector/collect.py
          fi
