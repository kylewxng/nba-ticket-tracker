name: Collect Ticketmaster prices

on:
  schedule:
    # Every 6 hours at :23. Ticketmaster's face-value ranges move slowly.
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ticketmaster
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect Ticketmaster prices
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collector/ticketmaster.py
